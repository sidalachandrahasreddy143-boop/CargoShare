name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_WEB: ${{ github.repository }}/web
  IMAGE_API: ${{ github.repository }}/api

jobs:
  # ─────────────────────────────────────────────── Quality gate
  test:
    name: Lint, type-check & unit tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cargoshare
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: cargoshare_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U cargoshare"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7.2-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Web build (type-check + bundle)
        run: npm run build
      - name: Backend — install & migrate & test
        working-directory: server
        env:
          DATABASE_URL: postgres://cargoshare:test_password@localhost:5432/cargoshare_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: ci_test_secret_not_for_production
          RAZORPAY_KEY_ID: rzp_test_ci
          RAZORPAY_KEY_SECRET: ci
        run: |
          npm install
          psql "$DATABASE_URL" -f sql/migrations/001_init.sql
          psql "$DATABASE_URL" -f sql/migrations/002_seed.sql
          npm test --if-present

  # ─────────────────────────────────────────────── Build & push images
  build:
    name: Build & push Docker images
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push web
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_WEB }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_WEB }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build & push api
        uses: docker/build-push-action@v6
        with:
          context: ./server
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_API }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_API }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────── Deploy to K3s/K8s
  deploy:
    name: Rolling deploy to production cluster
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
      - name: Point kubectl at the cluster
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG_B64 }}" | base64 -d > ~/.kube/config
      - name: Rollout new images
        run: |
          kubectl -n cargoshare set image deploy/web \
            web=${{ env.REGISTRY }}/${{ env.IMAGE_WEB }}:${{ github.sha }}
          kubectl -n cargoshare set image deploy/api \
            api=${{ env.REGISTRY }}/${{ env.IMAGE_API }}:${{ github.sha }}
          kubectl -n cargoshare rollout status deploy/api --timeout=180s
          kubectl -n cargoshare rollout status deploy/web --timeout=180s
      - name: Smoke test
        run: |
          sleep 10
          curl -fsS https://cargoshare.example.com/api/health | grep '"status":"ok"'

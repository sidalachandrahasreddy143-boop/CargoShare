# Dev reverse proxy (HTTP). For production TLS, use nginx/prod.conf + certbot.
map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

upstream cargoshare_web {
  server web:80;
}
upstream cargoshare_api {
  server backend:4000;
}

server {
  listen 80;
  server_name _;

  client_max_body_size 25m;

  # Security headers
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  location /api/ {
    proxy_pass http://cargoshare_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 75s;
  }

  location /socket.io/ {
    proxy_pass http://cargoshare_api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 86400s;  # long-lived WS
  }

  location /metrics {
    proxy_pass http://cargoshare_api;
    # Restrict /metrics at the edge in production
    allow 172.0.0.0/8;
    deny all;
  }

  location / {
    proxy_pass http://cargoshare_web;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }
}

# Production TLS config — HTTP→HTTPS redirect + Let's Encrypt certs.
# 1) Point DNS A-record at the server
# 2) docker compose --profile prod up -d nginx certbot
# 3) First cert: docker compose run --rm certbot certonly --webroot -w /var/www/certbot -d cargoshare.example.com --email admin@cargoshare.example.com --agree-tos
# 4) Switch nginx to this file and reload.
map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}
upstream cargoshare_web { server web:80; }
upstream cargoshare_api { server backend:4000; }

server {
  listen 80;
  server_name cargoshare.example.com;
  location /.well-known/acme-challenge/ { root /var/www/certbot; }
  location / { return 301 https://$host$request_uri; }
}

server {
  listen 443 ssl;
  http2 on;
  server_name cargoshare.example.com;

  ssl_certificate     /etc/letsencrypt/live/cargoshare.example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/cargoshare.example.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

  client_max_body_size 25m;

  location /api/ {
    proxy_pass http://cargoshare_api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location /socket.io/ {
    proxy_pass http://cargoshare_api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_read_timeout 86400s;
  }
  location / {
    proxy_pass http://cargoshare_web;
    proxy_set_header Host $host;
  }
}
